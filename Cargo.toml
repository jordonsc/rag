[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingest",
    "crates/serve",
    "crates/mcp",
]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["jordonsc"]

[workspace.dependencies]
# Internal
rag-core = { path = "crates/core" }

# Async runtime + HTTP
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["toml", "env"] }

# Vector DB
qdrant-client = "1.13"

# Ledger store (SQLite, source of truth for the decision/incident ledger)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Tracker store: attachment hashes and revision diffs
sha2 = "0.10"
similar = "2"

# Observability + errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v5"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
